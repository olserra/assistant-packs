    en: references/market-brief.md
    pt: references/resumo-de-mercados.md
  - id: price-alerts
    en: references/price-alerts.md
    pt: references/alertas-de-preco.md
  - id: weekly-wrap
    en: references/weekly-wrap.md
    pt: references/balanco-semanal.md
requires: [scheduled-messages, web-search]
optional: [recurring-checks]
