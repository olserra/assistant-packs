id: market-watch
number: 3
name: Market Watch
name_pt: De Olho no Mercado
version: 0.1.0
status: live
languages: [en, pt]
summary: Your assistant follows the markets for you - a short market brief before the open, price and move alerts you set, and a weekly wrap. Facts only, never advice, never trades.
